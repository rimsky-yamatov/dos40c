name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils python3

      - name: Build kernel, floppy images and ISO
        run: make all

      - name: Host unit tests (alloc / FAT12 / dir / handles)
        run: make test

      - name: Emulator boot tests (no QEMU)
        run: make emu-test

      - name: ISO structure test
        run: make iso-test

      - name: Checksums
        run: |
          cd build
          sha256sum dos40c.img dos40c.iso > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dos40c
          path: |
            build/dos40c.img
            build/dos40c.iso
            build/dos40c-test.img
            build/SHA256SUMS

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dos40c
          path: build

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Boot floppy self-test image in QEMU
        run: sh tools/smoke.sh build/dos40c-test.img

      - name: Boot the ISO in QEMU (CD-ROM, El Torito)
        run: |
          timeout 20 qemu-system-i386 -display none -boot d \
            -cdrom build/dos40c.iso -serial file:build/iso-serial.log || true
          cat build/iso-serial.log
          grep -q "Welcome to DOS40C" build/iso-serial.log

  release:
    # one release per successful build; the smoke result is recorded in the
    # release notes (a failed smoke test marks the release as pre-release)
    needs: [build, smoke]
    if: ${{ always() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dos40c
          path: dist

      - name: Compose release notes
        run: |
          {
            echo "Automated build of commit \`${GITHUB_SHA::7}\` (run #${GITHUB_RUN_NUMBER})."
            echo
            echo "- QEMU smoke test: **${{ needs.smoke.result }}**"
            echo "- \`dos40c.img\` - 1.44MB bootable floppy image"
            echo "- \`dos40c.iso\` - bootable CD-ROM image (El Torito floppy emulation)"
            echo
            echo "Try it: \`qemu-system-i386 -drive file=dos40c.img,format=raw,if=floppy -boot a\`"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: DOS40C 4.0.${{ github.run_number }}
          body_path: notes.md
          prerelease: ${{ needs.smoke.result != 'success' }}
          files: |
            dist/dos40c.img
            dist/dos40c.iso
            dist/SHA256SUMS
