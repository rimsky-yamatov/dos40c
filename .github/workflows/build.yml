name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils python3

      - name: Build kernel, floppy images and ISO
        run: make all

      - name: Host unit tests (alloc / FAT12 / dir / handles)
        run: make test

      - name: Emulator boot tests (no QEMU)
        run: make emu-test

      - name: ISO structure test
        run: make iso-test

      - name: Checksums
        run: |
          cd build
          sha256sum dos40c.img dos40c.iso > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dos40c
          path: |
            build/dos40c.img
            build/dos40c.iso
            build/dos40c-test.img
            build/SHA256SUMS
